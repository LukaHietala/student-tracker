                        <div>
                            <span x-text="$store.state.groups.length <= 0 ? 'Ei ryhmiä' : ''"></span>
                        </div>
                        <div class="item-actions">
                            <button class="primary-btn"
                                    x-on:click="adding = !adding">
                                Lisää ryhmä
                            </button>
                        </div>
                    </div>
                    <div class="editing-menu" x-show="adding" x-data="{ add_name:'' }">
                        <div class="editing-menu-title">
                            <span>Lisää uusi ryhmä</span>
                        </div>
                        <div style="padding: 15px;">
                            <label for="name">Nimi:</label>
                            <input type="text" name="name" x-model="add_name"/>
                        </div>
                        <div class="editing-menu-actions">
                            <button class="primary-btn"
                                    x-on:click="addGroup(add_name);
												add_name = '';
												adding = false">
                                Lisää
                            </button>
                            <button class="primary-btn"
                                    x-on:click="add_name='';
                                                adding = false">
                                Peruuta
                            </button>
                        </div>
                    </div>

													add_student = JSON.parse(JSON.stringify(defaultStudent))
													} else {

                                                        <template x-if="edit.schedule[5]!=null">
                                                            <input type="time"
                                                                   x-model="edit.schedule[5].start"/>
                                                        </template>
                                                        <template x-if="edit.schedule[5]!=null">
                                                            <input type="time"
                                                                   x-model="edit.schedule[5].end"/>
                                                        </template>
                                                        <input type="checkbox"
                                                               :checked="edit.schedule[5]!=null"
                                                               x-on:click=
                                                               "if(edit.schedule[5]==null)
                                                                edit.schedule[5]={start:'08:00:00',end:'16:00:00'}
                                                                else
                                                                edit.schedule[5]=null">
                                                    </div>
                                                    <div class="schedule-item"
                                                         :class="edit.schedule[6] == null ?
                                                                 'disabled' : ''">
                                                        <span style="text-align:center;">Su</span>
                                                        <template x-if="edit.schedule[6]==null">
                                                            <input type="time"
                                                                   :disabled="edit.schedule[6]==null"/>
                                                        </template>
                                                        <template x-if="edit.schedule[6]==null">
                                                            <input type="time"
                                                                   :disabled="edit.schedule[6]==null"/>
                                                        </template>
                                                        <template x-if="edit.schedule[6]!=null">
                                                            <input type="time"
                                                                   x-model="edit.schedule[6].start"/>
                                                        </template>
                                                        <template x-if="edit.schedule[6]!=null">
                                                            <input type="time"
                                                                   x-model="edit.schedule[6].end"/>
                                                        </template>
                                                        <input type="checkbox"
                                                               :checked="edit.schedule[6]!=null"
                                                               x-on:click=
                                                               "if(edit.schedule[6]==null)
                                                                edit.schedule[6]={start:'08:00:00',end:'16:00:00'}
                                                                else
                                                                edit.schedule[6]=null">
                                                    </div>
                                                </div>
                                                
                                                <!-- BLOAT!! -->
                                                
                                                <div style="padding: 15px;">
                                                    <label for="excluded_days">Vapaapäivät (sinisellä):</label><br/>
                                                    <calendar-component :holidays="edit.excluded_days" id="student_calendar"
                                                                        :weekmask="edit.schedule">
                                                    </calendar-component>
                                                </div>
                                            </div>
                                            <div class="editing-menu-actions">
                                                <button class="primary-btn"
														x-on:click=
														"edit.excluded_days = document.getElementById('student_calendar').holidays;
                                                         await editStudent();
                                                         student = edit;
                                                         $store.state.editingStudent
														 = null;">													
													Tallenna muokkaus
												</button>
                                                <button class="primary-btn"
														x-on:click=
														"$store.state.editingStudent
														 = null;">
													Peru
												</button>
                                            </div>
                                        </div>
                                    </template>
									<!-- Scan log -->
									<template x-if="scans != null">
                                        <div class="inline-list"
											 x-data="{
													 filter_start: '',
													 filter_end: '',
													 
													 get filtered_scans() {
													 return scans.filter(
													 x =>
													 (this.filter_start != '' &&
													 this.filter_end != '' &&
													 x.timestamp >= this.filter_start
													 &&
													 x.timestamp <= this.filter_end)
													 ||
													 (this.filter_start != '' &&
													 this.filter_end == '' &&
													 x.timestamp >= this.filter_start)
													 ||
													 (this.filter_end != '' &&
													 this.filter_start == '' &&
													 x.timestamp <= this.filter_end)
													 ||
													 (this.filter_start == '' &&
													 this.filter_end == '')
													 )}
													 }">
                                            <div style="border-bottom: 1px solid var(--border); padding: 10px 15px; position: sticky;"> 
                                                <label for="start_date"> Aloitus päivä:</label>
                                                <input x-model="filter_start" type="date"/>
                                                <label for="start_date"> Lopetus päivä:</label>
                                                <input x-model="filter_end"
                                                       type="date"/>
                                            </div>
                                            <template x-for="scan in filtered_scans">
                                                <div class="inline-item">
                                                    <span x-text="scan.timestamp">
                                                    </span> - 
                                                    <span x-show="scan.new_status=='IN'">
                                                        Skannattiin sisään
                                                    </span>
                                                    <span x-show="scan.new_status=='OUT'">
                                                        Skannattiin ulos
                                                    </span>
                                                </div>
                                            </template>
                                            <div
                                                style="padding: 15px;"
                                                x-show="filtered_scans.length == 0">
                                                Ei skannauksia
                                            </div>
										</div>
									</template>
                                </div>
                            </template>
                        </div>
                    </div>
                </template>
            </div>
			<!-- Readers -->
			<h3>Lukijat</h3>
			<div class="list">
				<div class="item">
					<div>
						<span
							x-text="$store.state.deviceScan.message ?
									$store.state.deviceScan.message :
									($store.state.pairedDevices.length <= 0 ?
									'Ei yhdistettyjä lukijoita' : '')">
						</span>
					</div>
					<div class="item-actions">
						<button
							class="primary-btn"
							onclick="scanDevices()"
							:disabled="$store.state.deviceScan.active"
							x-text="$store.state.deviceScan.active ?
									'Etsitään...' : 'Etsi'">
						</button>
					</div>
				</div>

				<small x-show="$store.state.deviceScan.devices.length > 0">Löydetyt laitteet</small>
				<template x-for="device in $store.state.deviceScan.devices" :key="device.entry.text[0].split('=')[1]">
					<div class="item">
						<div>
							<span x-text="device.entry.name"></span><br/>
							<span class="small" x-text="device.entry.text[0].split('=')[1]"></span>
						</div>
						<button class="primary-btn"
								x-on:click="pairDevice(device.entry.name)"
								x-text="$store.state.pairing.name === device.entry.name
										? 'Paritetaan...' : 'Parita'"
								:disabled="$store.state.pairing.name ===
										   device.entry.name">
						</button>
					</div>
                </template>
				<small x-show="$store.state.deviceScan.devices.length > 0 &&
							   $store.state.pairedDevices.length > 0">
					Jo yhdistetyt laitteet
				</small>
				<template x-for="device in $store.state.pairedDevices" :key="device.id">
					<div class="multi-item-container" x-data="{ editing: false}">
						<div class="item" :class="device.online ? 'active' : ''">
							<div>
								<span x-text="device.name"></span>
								<span>Tila: </span>
								<span x-text="device.online ? 'Linjoilla' : 'Ei yhteyttä'"></span><br/>
								<span class="small" x-text="device.mac_addr"></span>
							</div>
							<div class="item-actions">
								<button class="icon-btn"
										x-on:click="editing = !editing">
									<img src="/static/pen.svg" alt="Edit"/>
								</button>
								<button class="icon-btn" x-on:click="deleteDevice(device.id)">
									<img src="/static/can.svg" alt="Unpair"/>
								</button>
							</div>
						</div>
						<div class="editing-menu"
							 x-show="editing"
							 x-data="{ edit_name: device.name }">
                            <div class="editing-menu-title">
                                <span>Muokataan laitetta:</span>
                                <span x-text="device.name"></span>
                            </div>
                            <div>
                                <div style="padding: 15px;">
                                    <label for="name">Nimi:</label><br/>
                                    <input x-model="edit_name"/><br/>
                                </div>
								<div class="editing-menu-actions">
                                    <button class="primary-btn"
											x-on:click="editing = false;
														editDevice(device.id,edit_name);
														device.name = edit_name">
										Tallenna muokkaus
									</button>
									<button class="primary-btn"
											x-on:click="editing = false;
														edit_name = device.name">
										Peru
									</button>
								</div>
							</div>
						</div>
					</div>
				</template>
			</div>
		</main>
	</body>
	<script>
		document.addEventListener("alpine:init", async () => {
			Alpine.store("state", {
				// Global items
				pairedDevices: [],
				groups: [],
                students: [],
				teachers: [],

				// Adding (GLOBAL REFERENCE TO LOCAL VARIABLE)
				addingStudent: null,
				
				// Editing
				editingStudent: null,

				// Per group items
				currentGroup: {
					id: null,
					students: [],
					archivedStudents: [],
				},

				// Current scan results
				deviceScan: {
					active: false,
					message: "",
					devices: [],
				},

				pairing: {
					active: false,
					name: "",
				},

				async init() {
					this.pairedDevices = await getPairedDevices();
					this.groups = await getGroups();
                    this.students = await getStudents();
				},
			});

			const state = Alpine.store("state");
			/*
			 * /students (GET) - Lists students (all, not per group)
			 * /students/{id} (GET,PUT,DELETE)
			 * PUT requires the full student object
			 * /students/archive (GET) - Lists all archived users
			 * /students/archive/{id} (DELETE) - Full deletes the user, avoid
			 * /groups (GET,POST) - List all groups and create one
			 *
			 * Students: https://github.com/LukaHietala/student-tracker/blob/master/api/students.go#L21
			 * Groups: https://github.com/LukaHietala/student-tracker/blob/master/api/groups.go#L21
			 * Devices: https://github.com/LukaHietala/student-tracker/blob/master/api/devices.go#L36
			 * Scans: https://github.com/LukaHietala/student-tracker/blob/master/api/scans.go#L15
			 * Teachers: https://github.com/LukaHietala/student-tracker/blob/master/api/teachers.go#L21
			 */

			window.defaultSchedule = [
				{start: "08:00:00", end: "16:00:00"},
				{start: "08:00:00", end: "16:00:00"},
				{start: "08:00:00", end: "16:00:00"},
				{start: "08:00:00", end: "16:00:00"},
				{start: "08:00:00", end: "16:00:00"},
				null, null
			];

			window.defaultStudent = {
				schedule: defaultSchedule,
				excluded_days: [],
			};
			
			window.filterStudents = (group_id) => state.students.filter((x) => x.group_id == group_id);
			
			async function getStudents() {
                try {
                    const response = await fetch(`/api/students`);
                    if (!response.ok) {
                        const result = await response.json();
                        throw new Error(result.error);
                    }
					return await response.json();
                } catch (error) {
                    toast(capitalizeFirstLetter(error.message))
                    console.error(error.message);
                }
            }
			
			async function getGroups() {
				try {
					const response = await fetch("/api/groups");
					if (!response.ok) {
						const result = await response.json();
						throw new Error(result.error);
					}

					return await response.json();
				} catch (error) {
                    toast(capitalizeFirstLetter(error.message))
					console.error(error.message);
				}
			}

			async function getTeachers() {
				try {
					const response = await fetch("/api/teachers");
					if (!response.ok) {
						const result = await response.json();
						throw new Error(result.error);
					}

					return await response.json();
				} catch (error) {
                    toast(capitalizeFirstLetter(error.message))
					console.error(error.message);
				}
			}

			async function getPairedDevices() {
				try {
					const response = await fetch("/api/devices");
					if (!response.ok) {
						const result = await response.json();
						throw new Error(result.error);
					}

					return await response.json();
				} catch (error) {
                    toast(capitalizeFirstLetter(error.message))
					console.error(error.message);
				}
			}

			window.addGroup = async function(name) {
				try {
					const response = await fetch("/api/groups/", {
						method: "POST",
						headers: {
							"Content-Type": "application/json",
						},
						body: JSON.stringify({ name: name }),
					});
					if (!response.ok) {
						const result = await response.json();
						throw new Error(result.error);
					}
					state.groups = await getGroups();
                    toast(`Lisättiin ryhmä ${name}`)
				} catch (error) {
                    toast(capitalizeFirstLetter(error.message))
					console.error(error.message);
				}
			}
			
			window.archiveGroup = async function(id) {
				try {
					const response = await fetch(`/api/groups/${id}`, {
						method: "DELETE",
					});
					if (!response.ok) {
						const result = await response.json();
						throw new Error(result.error);
					}
                    const result = await response.json()
                    toast(`Arkistoitiin ryhmä ${result.name}`)
					state.groups = await getGroups();
                } catch (error) {
                    toast(capitalizeFirstLetter(error.message))
                    console.error(error.message);
                }
            }

			window.addStudent = async function(group_id, student) {
				try {
                    const response = await fetch(`/api/groups/${group_id}/students`, {
						method: "POST",
						headers: {
							"Content-Type": "application/json",
						},
						body: JSON.stringify(student),
					});
					if (!response.ok) {
						const result = await response.json();
						throw new Error(result.error);
					}
                    toast(`Lisättiin oppilas ${student.name}`)
					state.students = await getStudents();
				} catch (error) {
                    toast(capitalizeFirstLetter(error.message))
					console.error(error.message);
				}
			}

			window.editStudent = async function() {
				try {
					const response = await fetch(`/api/students/${state.editingStudent.id}/`, {
						method: "PUT",
						headers: {
							"Content-Type": "application/json",
						},
						body: JSON.stringify(state.editingStudent),
					});
					if (!response.ok) {
						const result = await response.json();
						throw new Error(result.error);
					}
                    toast(`Muokattiin oppilasta ${state.editingStudent.name}`)
				} catch (error) {
                    toast(capitalizeFirstLetter(error.message))
					console.error(error.message);
				}
			}

			window.archiveStudent = async function(id) {
				try {
					const response = await fetch(`/api/students/${id}`, {
						method: "DELETE",
					});
					if (!response.ok) {
						const result = await response.json();
						throw new Error(result.error);
					}
                    const result = await response.json();
                    toast(`Arkistoitiin ${result.name}`);
					state.students = await getStudents();
                } catch (error) {
                    toast(capitalizeFirstLetter(error.message))
                    console.error(error.message);
                }
            }

            window.editDevice = async function(device_id, new_name) {
				try {
					const response = await fetch(`/api/devices/${device_id}/`, {
						method: "PUT",
						headers: {
							"Content-Type": "application/json",
						},
						body: JSON.stringify({name: new_name}),
					});
					if (!response.ok) {
						const result = await response.json();
						throw new Error(result.error);
					}
					toast(`Muokattiin laitetta ${new_name}`)
				} catch (error) {
					toast(capitalizeFirstLetter(error.message))
					console.error(error.message);
				}
			}

            window.deleteDevice = async function(id) {
				try {
					const response = await fetch(`/api/devices/${id}`, {
						method: "DELETE",
					});
					if (!response.ok) {
						const result = await response.json();
						throw new Error(result.error);
					}
                    const result = await response.json();
					state.pairedDevices = await getPairedDevices();
                    toast(`Poistettu yhteys laitteeseen: ${result.name}`);
                } catch (error) {
                    toast(capitalizeFirstLetter(error.message))
                    console.error(error.message);
                }
            }

            window.scanDevices = function () {
                state.deviceScan.devices = [];
                state.deviceScan.message = "";

                if (state.deviceScan.active) {
                    return;
                }

                const evtSource = new EventSource("/api/devices/scan");
                state.deviceScan.active = true;

                let found = 0;

                evtSource.onmessage = function (e) {
                    const device = JSON.parse(e.data);
                    found++;
                    state.deviceScan.devices.push(device);
                };

                evtSource.onerror = function (e) {
                    evtSource.close();
                    state.deviceScan.active = false;
                    state.deviceScan.message = "Virhe laitteiden etsimisessä";
                };

                evtSource.addEventListener("close", function (e) {
                    evtSource.close();
                    state.deviceScan.message = `Löydettiin ${found} laitetta`;
                    state.deviceScan.active = false;
                });
            };

            window.pairDevice = async function(name) {
                state.pairing.name = name;
                try {
                    const response = await fetch("/api/devices/pair", {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json",
                        },
                        body: JSON.stringify({name: name}),
                    });
                    if (!response.ok) {
                        const result = await response.json();
                        throw new Error(result.error);
                    }

                    const result = await response.json()
                    toast(`Pari lukijan ${result.name} muodostettu onnistuneesti`)
                    state.pairedDevices.push(result)
                    state.deviceScan.devices.splice(
                        state.deviceScan.devices.findIndex(item => item.entry.name === result.name), 1);
                    return result;
                } catch (error) {
                    toast(capitalizeFirstLetter(error.message))
                    console.error(error.message);
                } finally {
                    state.pairing.name = "";
                }
            }

			window.getScans = async function(student_id) {
				try {
                    const response = await fetch(`/api/scans/student/${student_id}`);
					if (!response.ok) {
						const result = await response.json();
						throw new Error(result.error);
					}
					return await response.json();
				} catch (error) {
                    toast(capitalizeFirstLetter(error.message))
					console.error(error.message);
				}
			}

			const wsUri = "ws://10.246.12.118:3000/ws";
			const websocket = new WebSocket(wsUri);

			websocket.addEventListener("message", (e) => {
				const message = JSON.parse(e.data);
				
				switch (message.event) {
                case "scan:new":
                    const scan = message.payload
                    if (scan.student_id === 0) {
						if (state.addingStudent != null) {
							state.addingStudent.uid = scan.uid;
							state.addingStudent = null;
						}
                        return;
                    }

                    const student = state.students.find((student) => student.id === scan.student_id);
                    if (student) {
                        toast(`Uusi skannaus: ${student.name}`);
                    } else {
                        console.error("Scan student_id not found in students")
                    }
                    break;
				case "student:new":
					state.students.push(message.payload);
					break;
                case "student:update":
                    const updatedStudent = message.payload;
					const ref = state.students[state.students.findIndex((student) => student.id === updatedStudent.id)];
					modify(ref, updatedStudent);
                    break;
                case "student:archive":
                    const archivedStudent = message.payload;
                    state.students.splice(
                        state.students.findIndex(student => student.id === archivedStudent.id), 1);
                    break;
				default:
					console.log("unknown event");
				}
			});

            // 3e664845
            // 0c6f6ac0
            // 89021ae3
		});
	</script>
</html>
