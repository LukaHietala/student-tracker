<!doctype html>
<html>
	<head>
		<script defer
				src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js">
		</script>
		<script type="text/javascript" src="/static/calendar.js"></script>
        <style>
            :root {
                --background: #fcfcfc;
                --border: #dbdbdb;
                --border-dark: #bababa;
                --border-darker: #ababab;
                --primary: #00a4e4;
                --not-important: #858585;
            }


            * {
                font-family: sans-serif; 
                line-height: 1.5;
            }

            body {
                background-color: var(--background)
            }

            main {
				max-width: 800px;
				margin: 50px auto;
				display: flex;
				flex-direction: column;
				gap: 8px
            }

            button {
                cursor: pointer;
                border-radius: 4px;
            }

            .small {
                font-size: 0.8em;
                color: var(--not-important);
            }

            .list {
                display: flex;
                flex-direction: column;
                gap: 6px;
            }

            .item {
                display: inline-flex;
                justify-content: space-between;
                background: white;
                padding: 10px 15px;
                border: 1px solid var(--border);
                border-radius: 4px;
                align-items: center;
            }

            .item-actions {
                display: inline-flex;
                gap: 6px;
            }

			.primary-btn {
                background-color: white;
                border: 1px solid var(--border-dark);
                padding: 5px 10px;
            }

            .primary-btn:hover {
				background-color: #f5f5f5;
				border: 1px solid var(--border-darker);
            }

            .icon-btn {
				background-color: white;
				border: 1px solid var(--border-dark);
				display: flex;
				padding: 8px;
            }

            .icon-btn:hover {
				background-color: #f5f5f5;
				border: 1px solid var(--border-darker);
            }

            .active {
				border-color: #00a4e4 !important;
            }

			.calendar {
				width: fit-content;
				border: 5px black solid;
			}
			.calendar-box {
				border: 1px black solid;
			}
			.calendar-active {
				background-color: #00a4e4;
			}

        </style>
	</head>
	<body>
		<calendar-component></calendar-component>
        <main x-data="">
            <h3>Oppilaat</h3>
            <div x-show="$store.state.students.length <= 0" class="item">
				Ei oppilaita
			</div>
			<!-- Students -->
			<template x-if="$store.state.students.length > 0">
				<div class="list">
					<div class="item">
						<!-- Flexbox-shenanigans -->
						<div></div>
						<div class="item-actions">
							<button class="primary-btn">Massamuokkaus</button>
							<button class="primary-btn">Lisää oppilas</button>
						</div>
					</div>
					<template
						x-for="student in $store.state.students"
						:key="student.id"><div>
							<!-- Student info -->
							<div class="item"
								 :class="student.status == 'IN' ? 'active' : ''">
								<div>
									<span x-text="student.name"></span>
									<span x-text="student.uid"></span>
									<span x-text="student.remaining"></span>
								</div>
								<div class="item-actions">
									<button class="icon-btn"
											x-on:click=
											"if ($store.state.editingStudent)
											 $store.state.editingStudent = null
											 else 
											 $store.state.editingStudent =
											 JSON.parse(JSON.stringify(student));
											 ">
										<img src="/static/pen.svg" alt="Edit"/>
									</button>
									<button class="icon-btn">
										<img src="/static/can.svg" alt="Delete"/>
									</button>
								</div>
							</div>
							<!-- Editing menu -->
							<template x-if="$store.state.editingStudent &&
											$store.state.editingStudent.id ==
											student.id">
								<div class="" 
									 x-data="{edit:$store.state.editingStudent}">
									<p>Muokataan oppilasta:
										<span x-text="edit.name"></span>
									</p>
									<label for="name">Nimi:</label><br>
									<input x-model="edit.name"/><br>
									<label for="status">Tila:</label><br>
									<select id="status"
											x-model="edit.status">
										<option value="IN">IN</option>
										<option value="OUT">OUT</option>
									</select><br>
									<label for="start_date">
										Aloitus päivä:</label>
									<label for="start_date">
										Lopetus päivä:</label><br>
									<input x-model="edit.start_date" type="date"/>
									<input x-model="edit.end_date" type="date"/><br/>
								</div>
							</template>
					</div></template>
				</div>
			</template>
			<!-- Readers -->
            <h3>Yhdistetyt lukijat</h3>
            <div class="list">
                <div x-show="$store.state.pairedDevices.length <= 0" class="item">
                    Ei yhdistettyjä lukijoita
                    <div class="item-actions">
						<button class="primary-btn" onclick="scanDevices()">Etsi</button>
					</div>
                </div>

                <div x-show="$store.state.pairedDevices.length > 0" class="item">
                    <div>
                        <span x-text="$store.state.deviceScan.message">mirri</span>
                    </div>
                    <div class="item-actions">
						<button class="primary-btn" onclick="scanDevices()" x-text="$store.state.deviceScan.active ? 'Etsitään...' : 'Etsi'"></button>
					</div>
                </div>

                <small x-show="$store.state.deviceScan.devices.length > 0">Löydetyt laitteet</small>
                <template
                    x-for="device in $store.state.deviceScan.devices"
                    :key="device.id">
					<div class="item">
						<div>
                            <span x-text="device.entry.name"></span><br />
							<span class="small" x-text="device.entry.text[0].split('=')[1]"></span>
						</div>
						<div class="item-actions">
							<button class="primary-btn">
                                Yhdistä
							</button>
						</div>
                    </div>
				</template>

                <small x-show="$store.state.deviceScan.devices.length > 0">Jo yhdistetyt laitteet</small>
				<template
                    x-for="device in $store.state.pairedDevices"
                    :key="device.id">
					<div class="item active">
						<div>
                            <span x-text="device.name"></span>
                            <span>Tila: </span>
                            <span x-text="device.online ? 'Yhdistettynä' : 'Ei yhdistettynä'"></span><br />
							<span class="small" x-text="device.mac_addr"></span>
						</div>
						<div class="item-actions">
							<button class="icon-btn">
								<img src="/static/pen.svg" alt="Edit" />
							</button>
							<button class="icon-btn">
								<img src="/static/can.svg" alt="Unpair" />
							</button>
						</div>
                    </div>
				</template>
            </div>
		</main>
	</body>
	<script>
		document.addEventListener("alpine:init", async () => {
			Alpine.store("state", {
				error: null,
				// Global items
				students: [],
				archivedStudents: [],
				pairedDevices: [],
				notPairedDevices: [],
				groups: [],
				teachers: [],

				// Editing
				editingStudent: null,

				// Per group items
				currentGroup: {
					id: null,
					students: [],
					archivedStudents: []
				},
                
                // Current scan results
                deviceScan: {
                    active: false,
                    message: "",
                    devices: []
                },

				async init() {
					this.students = await getStudents();
					this.pairedDevices = await getPairedDevices();
					this.groups = await getGroups();
				},
			});

            const state = Alpine.store("state");
			/*
			 * /students (GET) - Lists students (all, not per group)
			 * /students/{id} (GET,PUT,DELETE)
			 * PUT requires the full student object
			 * /students/archive (GET) - Lists all archived users
			 * /students/archive/{id} (DELETE) - Full deletes the user, avoid
			 * /groups (GET,POST) - List all groups and create one
			 *
			 * Students: https://github.com/LukaHietala/student-tracker/blob/master/api/students.go#L21
			 * Groups: https://github.com/LukaHietala/student-tracker/blob/master/api/groups.go#L21
			 * Devices: https://github.com/LukaHietala/student-tracker/blob/master/api/devices.go#L36
			 * Scans: https://github.com/LukaHietala/student-tracker/blob/master/api/scans.go#L15
			 * Teachers: https://github.com/LukaHietala/student-tracker/blob/master/api/teachers.go#L21
			 */

			async function getGroups() {
				try {
					const response = await fetch("/api/groups")
					if (!response.ok) {
						const err = await response.json().error
						Alpine.store("state").error = err
						throw new Error(err)
					}

					return await response.json()
				} catch (error) {
					console.error(error.message);
				}
			}

			async function getTeachers() {
				try {
					const response = await fetch("/api/teachers")
					if (!response.ok) {
						const err = await response.json().error
						Alpine.store("state").error = err
						throw new Error(err)
					}

					return await response.json()
				} catch (error) {
					console.error(error.message);
				}
			}


			async function getStudents() {
				try {
					const response = await fetch("/api/students");
					if (!response.ok) {
						const err = await response.json().error
						Alpine.store("state").error = err
						throw new Error(err)
					}

					return await response.json();
				} catch (error) {
					console.error(error.message);
				}
			}

			async function getPairedDevices() {
				try {
					const response = await fetch("/api/devices");
					if (!response.ok) {
						const err = await response.json().error
						Alpine.store("state").error = err
						throw new Error(err)
					}

					return await response.json();
				} catch (error) {
					console.error(error.message);
				}
			}

            // TODO: const controller = new AbortController();
			window.scanDevices = function() {
                if (state.deviceScan.devices.length > 0) {
                    state.deviceScan.devices = [];
                }

				const evtSource = new EventSource("/api/devices/scan")
                state.deviceScan.active = true

				let found = 0;

				evtSource.onmessage = function(e) {
					const device = JSON.parse(e.data)
					found++;
                    state.deviceScan.devices.push(device)
				};

				evtSource.onerror = function(e) {
                    state.deviceScan.message = "Virhe laitteiden etsimisessä"
                    state.deviceScan.active = false
				};

				evtSource.addEventListener("close", function(e) {
					evtSource.close()
                    state.deviceScan.message = `Löydettiin ${found} laitetta`
                    state.deviceScan.active = false
				})
			};

			const wsUri = "ws://localhost:3000/ws";
			const websocket = new WebSocket(wsUri);

			websocket.addEventListener("message", (e) => {
				const message = JSON.parse(e.data)

				switch (message.event) {
				case "student:new":
					Alpine.store("state").students.push(message.payload)
				default:
					console.log("unknown event")
				}
				console.log(event);
			});

		});
	</script>
</html>
