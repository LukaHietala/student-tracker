<html>
	<head>

	<body>
		<main x-data="">
			<!-- Groups -->
			<h3>Ryhmät</h3>
            <div class="item">
                <div x-show="$store.state.groups.length <= 0">

						<span x-text="group.name"></span>

												</template>

												</template>
												<template x-if="edit.schedule[5]!=null">

                                                <input type="checkbox"

                                                       x-on:click=
													   "if(edit.schedule[5]==null)
														edit.schedule[5]={start:'08:00:00',end:'16:00:00'}
														else

											</div>
											<div class="rot"
                                                 :class="edit.schedule[6] == null ?
                                                         'disabled' : ''">
                                                <span style="text-align:center;">Su</span>
												<template x-if="edit.schedule[6]==null">

                                        <label for="excluded_days">Vapaapäivät:</label><br/>
                                        <calendar-component :holidays="edit.excluded_days" id="student_calendar"
                                                            :weekmask="edit.schedule">
                                        </calendar-component>
                                    </div>
                                    <div class="editing-menu-actions">
                                        <button class="primary-btn" x-on:click="edit.excluded_days = document.getElementById('student_calendar').holidays;
																				editStudent();
																				student = edit;

			<!-- Readers -->
			<h3>Lukijat</h3>
			<div class="list">
				<div class="item">
					<div>
						<span
							x-text="$store.state.deviceScan.message ?
									$store.state.deviceScan.message :
									($store.state.pairedDevices.length <= 0 ?
									'Ei yhdistettyjä lukijoita' : '')">
						</span>
					</div>
					<div class="item-actions">
						<button
							class="primary-btn"
							onclick="scanDevices()"
							:disabled="$store.state.deviceScan.active"
							x-text="$store.state.deviceScan.active ?
									'Etsitään...' : 'Etsi'">
						</button>
					</div>
				</div>

				<small x-show="$store.state.deviceScan.devices.length > 0">Löydetyt laitteet</small>
				<template x-for="device in $store.state.deviceScan.devices" :key="device.entry.text[0].split('=')[1]">
					<div class="item">
						<div>
							<span x-text="device.entry.name"></span><br/>
							<span class="small" x-text="device.entry.text[0].split('=')[1]"></span>
						</div>
						<button class="primary-btn"
								x-on:click="pairDevice(device.entry.name)"
								x-text="$store.state.pairing.name === device.entry.name
										? 'Paritetaan...' : 'Parita'"
								:disabled="$store.state.pairing.name ===
										   device.entry.name">
						</button>
					</div>
                </template>
				<small x-show="$store.state.deviceScan.devices.length > 0 &&
							   $store.state.pairedDevices.length > 0">
					Jo yhdistetyt laitteet
				</small>
				<template x-for="device in $store.state.pairedDevices" :key="device.id">
					<div class="item" :class="device.online ? 'active' : ''">
						<div>
							<span x-text="device.name"></span>
							<span>Tila: </span>
							<span x-text="device.online ? 'Linjoilla' : 'Ei yhteyttä'"></span><br/>
							<span class="small" x-text="device.mac_addr"></span>
						</div>

								<img src="/static/pen.svg" alt="Edit"/>
							</button>

	<script>
		document.addEventListener("alpine:init", async () => {
			Alpine.store("state", {
				// Global items
				pairedDevices: [],
				groups: [],
				teachers: [],

				// Editing
				editingStudent: null,

				// Per group items
				currentGroup: {
					id: null,
					students: [],
					archivedStudents: [],
				},

				// Current scan results
				deviceScan: {
					active: false,
					message: "",
					devices: [],
				},

				pairing: {
					active: false,
					name: "",
				},

				async init() {
					this.pairedDevices = await getPairedDevices();
					this.groups = await getGroups();
				},
			});

			const state = Alpine.store("state");
			/*
			 * /students (GET) - Lists students (all, not per group)
			 * /students/{id} (GET,PUT,DELETE)
			 * PUT requires the full student object
			 * /students/archive (GET) - Lists all archived users
			 * /students/archive/{id} (DELETE) - Full deletes the user, avoid
			 * /groups (GET,POST) - List all groups and create one
			 *
			 * Students: https://github.com/LukaHietala/student-tracker/blob/master/api/students.go#L21
			 * Groups: https://github.com/LukaHietala/student-tracker/blob/master/api/groups.go#L21
			 * Devices: https://github.com/LukaHietala/student-tracker/blob/master/api/devices.go#L36
			 * Scans: https://github.com/LukaHietala/student-tracker/blob/master/api/scans.go#L15
			 * Teachers: https://github.com/LukaHietala/student-tracker/blob/master/api/teachers.go#L21
			 */

			async function getGroups() {
				try {
					const response = await fetch("/api/groups");
					if (!response.ok) {
						const result = await response.json();
						throw new Error(result.error);
					}

					return await response.json();
				} catch (error) {
					console.error(error.message);
				}
			}

			async function getTeachers() {
				try {
					const response = await fetch("/api/teachers");
					if (!response.ok) {
						const result = await response.json();
						throw new Error(result.error);
					}

					return await response.json();
				} catch (error) {
					console.error(error.message);
				}
			}

			async function getPairedDevices() {
				try {
					const response = await fetch("/api/devices");
					if (!response.ok) {
						const result = await response.json();
						throw new Error(result.error);
					}

					return await response.json();
				} catch (error) {
					console.error(error.message);
				}
			}

			window.editStudent = async function() {
				try {
					const response = await fetch(`/api/students/${state.editingStudent.id}/`, {
						method: "PUT",
						headers: {
							"Content-Type": "application/json",
						},
						body: JSON.stringify(state.editingStudent),
					});
					if (!response.ok) {
						const result = await response.json();
						throw new Error(result.error);
					}
				} catch (error) {
					console.error(error.message);
				}
			}

			window.getStudents = async function(group_id, students) {
				try {
					const response = await fetch(`/api/groups/${group_id}/students`);
					if (!response.ok) {
						const result = await response.json();
						throw new Error(result.error);
					}
					students.length = 0;
					students.push(...await response.json());
					console.log(students);
				} catch (error) {
					console.error(error.message);
				}
			}

			// TODO: const controller = new AbortController();
			window.scanDevices = function () {
				state.deviceScan.devices = [];
				state.deviceScan.message = "";

				if (state.deviceScan.active) {
					return;
				}

				const evtSource = new EventSource("/api/devices/scan");
				state.deviceScan.active = true;

				let found = 0;

				evtSource.onmessage = function (e) {
					const device = JSON.parse(e.data);
					found++;
					state.deviceScan.devices.push(device);
				};

				evtSource.onerror = function (e) {
					evtSource.close();
					state.deviceScan.active = false;
					state.deviceScan.message = "Virhe laitteiden etsimisessä";
				};

				evtSource.addEventListener("close", function (e) {
					evtSource.close();
					state.deviceScan.message = `Löydettiin ${found} laitetta`;
					state.deviceScan.active = false;
				});
			};

			window.pairDevice = async function(name) {
				state.pairing.name = name;
				try {
					const response = await fetch("/api/devices/pair", {
						method: "POST",
						headers: {
							"Content-Type": "application/json",
						},
						body: JSON.stringify({name: name}),
					});
					if (!response.ok) {
						const result = await response.json();
						throw new Error(result.error);
					}

					const result = await response.json()
					toast(`Pari lukijan ${result.name} muodostettu onnistuneesti`)
					state.pairedDevices.push(result)
					state.deviceScan.devices.splice(
						state.deviceScan.devices.findIndex(item => item.entry.name === result.name), 1);
					return result;
				} catch (error) {
					toast(capitalizeFirstLetter(error.message))
					console.error(error.message);
				} finally {
					state.pairing.name = "";
				}
			}

			const wsUri = "ws://localhost:3000/ws";
			const websocket = new WebSocket(wsUri);

			websocket.addEventListener("message", (e) => {
				const message = JSON.parse(e.data);

				switch (message.event) {
				case "student:new":
					Alpine.store("state").students.push(message.payload);
				default:
					console.log("unknown event");
				}
				console.log(event);
			});
		});
	</script>
